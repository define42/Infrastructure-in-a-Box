name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use current patch releases of the Go version required by go.mod.
  GO_VERSION: '1.26.x'
  GOTOOLCHAIN: local

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Build
        run: go build ./...

      - name: Unit tests with race detection
        run: go test -race -count=1 -shuffle=on -timeout=5m ./...

      - name: Integration tests with race detection
        run: go test -race -count=1 -shuffle=on -timeout=5m -tags=integration ./...

  e2e-qemu:
    name: QEMU end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install VM test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86 iproute2 tcpdump dnsutils cpio

      - name: Boot Linux and test all services on isolated TAP
        run: make e2e-qemu

      - name: Save guest console, server log, and packet capture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-qemu-diagnostics
          path: artifacts/e2e-qemu/
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Go vet
        run: |
          go vet ./...
          go vet -tags=e2e_guest ./tests/e2e-qemu/guest

      - name: Lint Go and integration tests
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: Check formatting
        run: golangci-lint fmt --diff

      - name: Check known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
